<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickRide - Admin Panel</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- 🔐 Admin Login Screen -->
  <div id="adminLoginScreen" class="auth-container">
    <div class="auth-card">
      <h1 class="logo">🛠️ Admin Portal</h1>
      <p>Sign in with Admin Google Account</p>
      <button id="adminLoginBtn" class="google-btn">
        <img src="https://cdn-icons-png.flaticon.com/512/2991/2991148.png" alt="Google"> 
        Admin Google Login
      </button>
    </div>
  </div>

  <!-- 🖥️ Admin Dashboard (Hidden before login) -->
  <div id="adminDashboard" style="display: none;" class="dashboard-layout">
    
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">🛠️ QuickAdmin</div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" onclick="switchAdminTab('bookings', this)">📦 All Bookings</a>
        <a href="#" class="nav-link" onclick="switchAdminTab('cars', this)">🚗 Manage Cars</a>
      </nav>
      <div class="sidebar-footer">
        <button id="adminLogoutBtn" class="logout-btn">Logout</button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <header class="admin-header">
        <h2 id="pageTitle">Bookings Management</h2>
        <div class="admin-profile">
          <span id="adminName">Admin</span>
        </div>
      </header>

      <!-- TAB 1: BOOKINGS -->
      <section id="admin-tab-bookings" class="admin-section active">
        <div class="table-container">
          <table class="data-table">
            <thead>
              <tr>
                <th>User Info</th>
                <th>Car Name</th>
                <th>Route</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="adminBookingsTable">
              <!-- Bookings loaded via JS -->
            </tbody>
          </table>
        </div>
      </section>

      <!-- TAB 2: CARS MANAGEMENT -->
      <section id="admin-tab-cars" class="admin-section">
        <div class="card-box">
          <h3>Add New Car</h3>
          <form id="addCarForm" class="car-form">
            <input type="text" id="carNameInput" placeholder="Car Name (e.g. Swift Dzire)" required>
            <input type="number" id="carPriceInput" placeholder="Price per Day (₹)" required>
            <input type="text" id="carImgInput" placeholder="Image URL" required>
            <input type="number" id="carSeatsInput" placeholder="Seats (e.g. 5)" required>
            <input type="text" id="carAcInput" placeholder="AC / Non-AC" required>
            <input type="text" id="carFuelInput" placeholder="Fuel Type (Petrol/Diesel/EV)" required>
            <input type="number" id="carQtyInput" placeholder="Stock Quantity" required>
            <button type="submit" class="btn-primary">Add Car to Store</button>
          </form>
        </div>

        <h3 style="margin-top: 30px; margin-bottom: 15px;">Existing Fleet</h3>
        <div id="adminCarsGrid" class="admin-cars-grid">
          <!-- Fleet loaded via JS -->
        </div>
      </section>

    </main>
  </div>

  <!-- Load JS -->
  <script type="module" src="app.js"></script>
  
  <!-- Global Tab Function -->
  <script>
    function switchAdminTab(tabId, element) {
      document.querySelectorAll('.admin-section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => link.classList.remove('active'));
      
      document.getElementById('admin-tab-' + tabId).classList.add('active');
      element.classList.add('active');
      
      document.getElementById('pageTitle').textContent = tabId === 'bookings' ? 'Bookings Management' : 'Manage Cars';
    }
  </script>
</body>
</html>
