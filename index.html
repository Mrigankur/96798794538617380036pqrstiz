<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick-Ride - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard-layout">
        <aside class="sidebar">
            <div>
                <div class="sidebar-logo">🚗 Admin Panel</div>
                <nav class="sidebar-nav">
                    <a href="#" class="nav-link active" onclick="switchAdminTab('orders', this)">Live Orders</a>
                    <a href="#" class="nav-link" onclick="switchAdminTab('addCar', this)">Add Car & Stock</a>
                </nav>
            </div>
        </aside>

        <main class="main-content">
            <header class="admin-header">
                <h2>Live Control Center</h2>
            </header>

            <section id="ordersSection" class="admin-section active">
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Car</th>
                                <th>Route</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="adminOrdersTable"></tbody>
                    </table>
                </div>
            </section>

            <section id="addCarSection" class="admin-section">
                <div class="card-box">
                    <h3>Add New Fleet Vehicle with Quantity</h3>
                    <div class="car-form">
                        <input type="text" id="carName" placeholder="Car Name">
                        <input type="number" id="carPrice" placeholder="Price per day ($)">
                        <input type="number" id="carQty" placeholder="Quantity (Stock)" value="1">
                        <input type="text" id="carImage" placeholder="Image URL">
                        <button class="btn-primary" onclick="addNewCar()">Publish Car</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Notification Audio -->
    <audio id="notifSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, updateDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBySOEfSbkpl4csyqckfX-kLeIoD-85VYs",
            authDomain: "my-friend-hub.firebaseapp.com",
            databaseURL: "https://my-friend-hub-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "my-friend-hub",
            storageBucket: "my-friend-hub.firebasestorage.app",
            messagingSenderId: "1084141933087",
            appId: "1:1084141933087:web:1ae757acdd37a9c8427b2a",
            measurementId: "G-6E10B7M7WZ"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let isFirstLoad = true;

        function setupAdminLiveOrders() {
            const tableBody = document.getElementById('adminOrdersTable');
            const sound = document.getElementById('notifSound');

            onSnapshot(collection(db, "bookings"), (snapshot) => {
                if (!isFirstLoad) {
                    snapshot.docChanges().forEach((change) => {
                        if (change.type === "added") {
                            sound.play().catch(e => console.log("Audio play blocked:", e));
                        }
                    });
                }
                isFirstLoad = false;

                tableBody.innerHTML = '';
                snapshot.forEach((docSnap) => {
                    const b = docSnap.data();
                    const docId = docSnap.id;
                    tableBody.innerHTML += `
                        <tr>
                            <td>${b.userName}</td>
                            <td>${b.carName}</td>
                            <td>${b.pickup} ➔ ${b.drop}</td>
                            <td>${b.phone}</td>
                            <td><span class="status-badge status-${b.status.toLowerCase()}">${b.status}</span></td>
                            <td>
                                <div class="action-btn-group">
                                    <button class="btn-approve" onclick="updateStatus('${docId}', 'Confirmed')">Approve</button>
                                    <button class="btn-reject" onclick="updateStatus('${docId}', 'Cancelled')">Reject</button>
                                </div>
                            </td>
                        </tr>
                    `;
                });
            });
        }

        window.updateStatus = async function(id, status) {
            await updateDoc(doc(db, "bookings", id), { status });
        }

        window.addNewCar = async function() {
            const name = document.getElementById('carName').value;
            const price = document.getElementById('carPrice').value;
            const quantity = parseInt(document.getElementById('carQty').value) || 1;
            const image = document.getElementById('carImage').value;

            if(!name || !price || !image) return alert('Please fill required fields!');

            try {
                await addDoc(collection(db, "cars"), { name, price, quantity, image });
                alert('Car Added Successfully!');
                document.getElementById('carName').value = '';
                document.getElementById('carPrice').value = '';
                document.getElementById('carQty').value = '1';
                document.getElementById('carImage').value = '';
            } catch(e) {
                console.error(e);
            }
        }

        window.switchAdminTab = function(tab, el) {
            document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            if(tab === 'orders') {
                document.getElementById('ordersSection').classList.add('active');
            } else {
                document.getElementById('addCarSection').classList.add('active');
            }
            el.classList.add('active');
        }

        setupAdminLiveOrders();
    </script>
</body>
</html>
